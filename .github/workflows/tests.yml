name: Argus-ML CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Verify project structure
        run: |
          echo "Checking repository structure..."
          ls -la

          if [ ! -d tests ]; then
            echo "::error::Missing tests/ directory."
            exit 1
          fi

          find tests -type f -name "test_*.py" -print

          if ! find tests -type f -name "test_*.py" | grep -q .; then
            echo "::error::No pytest test files found."
            exit 1
          fi

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Collect tests
        run: python -m pytest --collect-only -q tests/

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          if-no-files-found: ignorev
