name: Argus-ML CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Verify test suite
        run: |
          test -f tests/test_argus_ml.py || {
            echo "::error::Missing tests/test_argus_ml.py"
            exit 1
          }

      - name: Compile Python files
        run: |
          python -m py_compile argus-ml.py tests/test_argus_ml.py

      - name: Collect tests
        run: |
          python -m pytest --collect-only -q tests/test_argus_ml.py

      - name: Run tests
        run: |
          python -m pytest -q tests/test_argus_ml.py
